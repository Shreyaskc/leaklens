name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install leaklens with test dependencies
        # datasets is needed even though it's an optional extra for end
        # users -- the test suite mocks datasets.load_dataset, which
        # requires the module importable. mlx is deliberately NOT
        # installed here: it only runs on Apple Silicon, and the MLX
        # integration tests in test_models.py skip themselves cleanly
        # when mlx_lm isn't importable (this CI runner is Linux).
        run: pip install -e ".[test,datasets]"
      - name: Run tests
        run: pytest tests/ -v --cov=leaklens --cov-report=term-missing
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
